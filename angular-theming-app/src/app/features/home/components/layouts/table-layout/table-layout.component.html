<mat-card appearance="outlined" class="table-card">
  <div class="table-toolbar">
    <mat-chip-listbox>
      <mat-chip-option selected>All Users</mat-chip-option>
      <mat-chip-option>Active</mat-chip-option>
      <mat-chip-option>Pending</mat-chip-option>
    </mat-chip-listbox>
    <span style="flex: 1"></span>
    <button mat-flat-button >
      <mat-icon>add</mat-icon> Invite
    </button>
  </div>

  <table
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z0"
    style="width: 100%"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let element">{{ element.role }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <span
          class="badge"
          [style.background]="
            'var(--mat-sys-' + element.statusColor + '-container)'
          "
          [style.color]="
            'var(--mat-sys-on-' + element.statusColor + '-container)'
          "
        >
          {{ element.status }}
        </span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10]"
    showFirstLastButtons
  ></mat-paginator>
</mat-card>
