<mat-card appearance="outlined" class="table-card">
  <div class="table-toolbar">
    <mat-chip-listbox>
      <mat-chip-option
        [selected]="activeFilter() === 'All'"
        (click)="setFilter('All')"
        >All Users</mat-chip-option
      >
      <mat-chip-option
        [selected]="activeFilter() === 'Active'"
        (click)="setFilter('Active')"
        >Active</mat-chip-option
      >
      <mat-chip-option
        [selected]="activeFilter() === 'Pending'"
        (click)="setFilter('Pending')"
        >Pending</mat-chip-option
      >
      <mat-chip-option
        [selected]="activeFilter() === 'Review'"
        (click)="setFilter('Review')"
        >Review</mat-chip-option
      >
      <mat-chip-option
        [selected]="activeFilter() === 'Offline'"
        (click)="setFilter('Offline')"
        >Offline</mat-chip-option
      >
    </mat-chip-listbox>

    <span class="table-span"></span>

    <button mat-flat-button (click)="inviteUser()" class="table-btn-action">
      <mat-icon>add</mat-icon> <span>Invite</span>
    </button>
  </div>

  <app-dynamic-table
    [data]="filteredUsers()"
    [config]="tableConfig"
  ></app-dynamic-table>
</mat-card>
