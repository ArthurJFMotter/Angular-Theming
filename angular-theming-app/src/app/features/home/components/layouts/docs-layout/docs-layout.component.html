<div class="docs-container">
  <!-- TREE -->
  <aside class="docs-sidebar">
    <app-dynamic-tree [data]="treeData" (nodeSelected)="onNodeSelected($event)">
    </app-dynamic-tree>
  </aside>

  <mat-divider vertical class="desktop-divider"></mat-divider>

  <!-- CONTENT PANE -->
  <article class="docs-content">
    @if (activeDoc()) {
      <span class="badge info">v1.1.0</span>
      <h1 style="color: var(--mat-sys-primary)">{{ activeDoc()?.title }}</h1>
      <p class="lead">{{ activeDoc()?.body }}</p>

      @if (activeDoc()?.code) {
        <div class="mock-code-block">
          <code>{{ activeDoc()?.code }}</code>
        </div>
      }
    } @else {
      <!-- Empty State -->
      <div class="empty-state">
        <mat-icon
          style="
            font-size: 48px;
            width: 48px;
            height: 48px;
            color: var(--mat-sys-outline-variant);
          "
          >menu_book</mat-icon
        >
        <p>Select an item from the tree on the left to explore the guides.</p>
      </div>
    }
  </article>
</div>
