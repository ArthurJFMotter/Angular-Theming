<div class="docs-container">
  <!-- Sidebar Tree Navigation -->
  <aside class="docs-sidebar">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
      <!-- Leaf Node -->
      <mat-nested-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <div
          class="mat-tree-node leaf-node"
          [class.active-node]="selectedNodeId() === node.id"
          (click)="selectNode(node)"
        >
          <span class="spacer-icon"></span>
          @if (node.icon) {
            <mat-icon class="node-icon">{{ node.icon }}</mat-icon>
          }
          <span class="node-text">{{ node.name }}</span>
        </div>
      </mat-nested-tree-node>

      <!-- Expandable Parent Node -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
        <div
          class="mat-tree-node parent-node"
          [class.active-node]="selectedNodeId() === node.id"
          (click)="selectNode(node)"
        >
          <button
            mat-icon-button
            matTreeNodeToggle
            [attr.aria-label]="'Toggle ' + node.name"
            (click)="$event.stopPropagation()"
          >
            <mat-icon
              class="mat-tree-node-toggle-icon"
              [class.expanded]="treeControl.isExpanded(node)"
            >
              chevron_right
            </mat-icon>
          </button>
          @if (node.icon) {
            <mat-icon class="node-icon">{{ node.icon }}</mat-icon>
          }
          <span class="node-text">{{ node.name }}</span>
        </div>

        <!-- Nested children container -->
        <div [class.hidden]="!treeControl.isExpanded(node)" role="group">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>
      </mat-nested-tree-node>
    </mat-tree>
  </aside>

  <!-- Docs Content Body (Dynamically Rendered) -->
  <main class="docs-content">
    @if (currentArticle(); as article) {
      <div class="article-header">
        <span class="badge" [ngClass]="article.badgeType">{{
          article.badge
        }}</span>
        <button mat-stroked-button class="copy-btn" (click)="copyCode()">
          <mat-icon>content_copy</mat-icon>
          Copy Code
        </button>
      </div>

      <h2>{{ article.title }}</h2>
      <p class="lead">{{ article.lead }}</p>

      <div class="code-container">
        <pre
          class="mock-code-block"
        ><code>{{ article.codeSnippet }}</code></pre>
      </div>
    }
  </main>
</div>
