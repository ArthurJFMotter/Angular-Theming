<div class="nav-header">
  <h3>Theming Lab</h3>
  <mat-button-toggle-group
    class="view-toggle"
    [value]="viewMode"
    (change)="onModeChange($event.value)"
  >
    <mat-button-toggle value="elements">Elements</mat-button-toggle>
    <mat-button-toggle value="layouts">Layouts</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<div class="spy-menu">
  @for (section of sections; track section.id) {
    <button
      [class.active]="activeSectionId === section.id"
      (click)="scrollToSection(section.id)"
    >
      {{ section.title }}
    </button>
  }
</div>
