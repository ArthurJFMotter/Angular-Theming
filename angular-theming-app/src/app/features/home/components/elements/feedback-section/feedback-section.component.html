<div class="state-matrix">
  <div class="matrix-row">
    <span class="row-label">Progress</span>
    <mat-progress-bar mode="indeterminate" style="flex: 1"></mat-progress-bar>
    <mat-spinner diameter="32"></mat-spinner>
  </div>
  <div class="matrix-row">
    <span class="row-label">Trigger Snackbars</span>
    <button
      mat-flat-button
      class="btn-success-container"
      (click)="triggerToast('success')"
    >
      Success
    </button>
    <button
      mat-flat-button
      class="btn-warning-container"
      (click)="triggerToast('warning')"
    >
      Warning
    </button>
    <button
      mat-flat-button
      class="btn-info-container"
      (click)="triggerToast('info')"
    >
      Info
    </button>
    <button
      mat-flat-button
      class="btn-error-container"
      (click)="triggerToast('error')"
    >
      Error
    </button>
  </div>
</div>
