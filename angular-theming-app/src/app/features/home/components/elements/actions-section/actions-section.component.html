<div class="state-matrix">
  <!-- FILLED BUTTONS -->
  <div class="matrix-row">
    <span class="row-label">Filled</span>
    <button mat-flat-button>Primary</button>
    <button mat-flat-button class="btn-secondary">Secondary</button>
    <button mat-flat-button class="btn-tertiary">Tertiary</button>
    <button mat-flat-button class="btn-error">Error</button>
    <button mat-flat-button disabled>Disabled</button>
  </div>

  <!-- STROKED BUTTONS -->
  <div class="matrix-row">
    <span class="row-label">Stroked</span>

    <button mat-stroked-button>Primary</button>
    <button mat-stroked-button class="btn-secondary">Secondary</button>
    <button mat-stroked-button class="btn-tertiary">Tertiary</button>
    <button mat-stroked-button class="btn-error">Error</button>
    <button mat-stroked-button disabled>Disabled</button>
  </div>

  <!-- BUTTON TOGGLES -->
  <div class="matrix-row">
    <span class="row-label">Toggle</span>

    <mat-button-toggle-group
      value="bold"
      name="fontStyle"
      aria-label="Font Style"
    >
      <mat-button-toggle value="bold">Bold</mat-button-toggle>
      <mat-button-toggle value="italic">Italic</mat-button-toggle>
      <mat-button-toggle value="underline">Underline</mat-button-toggle>
    </mat-button-toggle-group>

    <mat-button-toggle-group
      appearance="legacy"
      value="bold"
      name="fontStyle"
      aria-label="Font Style"
    >
      <mat-button-toggle value="bold">Bold</mat-button-toggle>
      <mat-button-toggle value="italic">Italic</mat-button-toggle>
      <mat-button-toggle value="underline">Underline</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <!-- FABs AND CHIPS -->
  <div class="matrix-row">
    <span class="row-label">FAB & Chips</span>

    <button mat-fab><mat-icon>add</mat-icon></button>

    <button mat-mini-fab class="btn-secondary">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-mini-fab class="btn-tertiary">
      <mat-icon>bookmark</mat-icon>
    </button>

    <mat-chip-listbox>
      <mat-chip-option selected>Selected</mat-chip-option>
      <mat-chip-option>Default</mat-chip-option>
      <mat-chip-option disabled>Disabled</mat-chip-option>
    </mat-chip-listbox>
  </div>
</div>
