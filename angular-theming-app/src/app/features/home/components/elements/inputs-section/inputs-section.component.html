<div class="state-matrix">
  <!-- Input Section -->
  <div class="matrix-row inputs-row">
    <mat-form-field appearance="outline">
      <mat-label>Standard Input</mat-label>
      <input matInput placeholder="Placeholder" />
      <mat-icon matSuffix>person</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Error State</mat-label>
      <input matInput [formControl]="emailControl" placeholder="Email" />
      <mat-error>Invalid email format</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Disabled</mat-label>
      <input matInput disabled value="Locked value" />
    </mat-form-field>
  </div>

  <!-- Checkbox Section -->
  <div class="matrix-row">
    <span class="row-label">Checkboxes</span>
    <mat-checkbox checked>Primary</mat-checkbox>
    <mat-checkbox checked class="theme-secondary">Secondary</mat-checkbox>
    <mat-checkbox checked class="theme-tertiary">Tertiary</mat-checkbox>
    <mat-checkbox checked class="theme-error">Error</mat-checkbox>
    <mat-checkbox checked disabled>Disabled</mat-checkbox>
  </div>
  <!-- Toggle Section -->
  <div class="matrix-row">
    <span class="row-label">Toggles</span>
    <mat-slide-toggle checked>Enabled</mat-slide-toggle>
    <mat-slide-toggle checked class="theme-secondary">Enabled</mat-slide-toggle>
    <mat-slide-toggle checked class="theme-tertiary">Enabled</mat-slide-toggle>
    <mat-slide-toggle checked class="theme-error">Enabled</mat-slide-toggle>
    <mat-slide-toggle disabled>Disabled</mat-slide-toggle>
  </div>

  <!-- Radio Button Section -->
  <div class="matrix-row">
    <span class="row-label">Radio buttons</span>
    <mat-radio-group value="1">
      <mat-radio-button value="1">Option 1</mat-radio-button>
      <mat-radio-button value="2" class="theme-secondary"
        >Option 2</mat-radio-button
      >
      <mat-radio-button value="3" class="theme-tertiary"
        >Option 3</mat-radio-button
      >
      <mat-radio-button value="0" class="theme-error"
        >Invalid Option</mat-radio-button
      >
      <mat-radio-button disabled value="-1">Locked Option</mat-radio-button>
    </mat-radio-group>
  </div>

  <!-- Slider Section -->
  <div class="matrix-row">
    <span class="row-label">Slider</span>
    <mat-slider
      min="0"
      max="100"
      step="10"
      showTickMarks
      discrete
      style="flex: 1; min-width: 200px; margin: 0 16px"
    >
      <input matSliderThumb value="50" />
    </mat-slider>
  </div>
</div>
