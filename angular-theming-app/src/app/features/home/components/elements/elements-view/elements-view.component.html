<section id="actions" #spyTarget class="canvas-section">

</section>
<mat-divider></mat-divider>
<section id="inputs" #spyTarget class="canvas-section">

</section>

  } @placeholder {
    <div class="loading-placeholder">Loading Feedback...</div>
  }
