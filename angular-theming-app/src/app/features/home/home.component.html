<div class="sandbox-layout">
  <!-- DYNAMIC NAVIGATION -->
  <app-sandbox-nav
    [viewMode]="viewMode()"
    (viewModeChange)="switchMode($event)"
    [sections]="currentSections()"
    [activeSectionId]="activeSectionId()"
  >
  </app-sandbox-nav>

  <!-- DYNAMIC CANVAS -->
  <main class="canvas">
    @if (viewMode() === "elements") {
      <app-elements-view
        [sections]="elements"
        (sectionScrolled)="activeSectionId.set($event)"
      ></app-elements-view>
    } @else {
      <app-layouts-view
        [sections]="layouts"
        (sectionScrolled)="activeSectionId.set($event)"
      ></app-layouts-view>
    }
  </main>
</div>
