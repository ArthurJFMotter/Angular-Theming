<div class="field-group">
  @if (label) {
    <label>{{ label }}</label>
  }
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    class="full-width"
  >
    <mat-select
      [value]="value"
      (selectionChange)="valueChange.emit($event.value)"
      [disabled]="disabled"
    >
      <mat-select-trigger>{{ selectedLabel }}</mat-select-trigger>

      @for (option of options; track option.value) {
        <mat-option [value]="option.value">
          <div class="option-label">
            <span>{{ option.label }}</span>
            @if (option.desc) {
              <span class="option-description">{{ option.desc }}</span>
            }
          </div>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
