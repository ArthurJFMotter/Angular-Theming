<mat-toolbar class="app-navbar">
  <!-- Drawer Trigger -->
  @if (isDrawerMode()) {
    <button
      mat-icon-button
      (click)="drawer.toggle()"
      class="drawer-trigger"
      [class]="drawerPos()"
      [class.is-open]="drawer.opened"
      aria-label="Toggle Settings"
    >
      <mat-icon>{{ drawer.opened ? "menu_open" : drawerIcon() }}</mat-icon>
    </button>
  }

  <!-- BRAND -->
  <div class="brand" routerLink="/">
    <h1>NGMP Demo</h1>
  </div>

  <span class="toolbar-spacer"></span>
</mat-toolbar>
